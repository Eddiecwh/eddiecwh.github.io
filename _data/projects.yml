      alt: HF Scoring dashboard with New Stage, Stage Library, and Quick Score
    - src: /assets/img/hf-scoring/02-scoring.jpg
      alt: Scoring screen with A, C, D, M, NS, and NPM buttons for each target
    - src: /assets/img/hf-scoring/03-hit-factor.jpg
