- name: HF Scoring
  group: Apps
  status: Live
  year: 2025
  tagline: Stage scoring for USPSA matches, on your phone.
  summary: >-
    A mobile-first scoring app for USPSA stages: configure paper and steel, tap in hits,
    and get hit factor instantly. Stage library, results dashboard, analytics, and CSV
    export — all local, no account needed.
  stack: [JavaScript, GitHub Pages, localStorage]
  demo: https://eddiecwh.github.io/uspsa_scoring/
  repo: https://github.com/Eddiecwh/uspsa_scoring
  featured: true
  hero: true
  screens:
    - src: /assets/img/hf-scoring/01-dashboard.jpg
      alt: HF Scoring dashboard with New Stage, Stage Library, and Quick Score
    - src: /assets/img/hf-scoring/02-scoring.jpg
      alt: Scoring screen with A, C, D, M, NS, and NPM buttons for each target
    - src: /assets/img/hf-scoring/03-hit-factor.jpg
      alt: Score preview showing a hit factor of 3.4200
    - src: /assets/img/hf-scoring/04-review.jpg
      alt: Score review table with hits, time, total points, and hit factor

- name: DataFlow
  group: Backend Systems
  status: Shipped
  year: 2026
  tagline: Uploads as a workflow, not a file input.
  summary: >-
    Multipart uploads go straight to S3 through presigned URLs, then a job pipeline
    validates metadata, records every object, and hands off async processing — so
    large files never touch the API server.
  stack: [Java 21, Spring Boot, PostgreSQL, AWS S3, MapStruct]
  repo: https://github.com/Eddiecwh/DataFlow
  featured: true
  posts:
    - title: Project talkthrough & goal setting
      url: /posts/File-Processing-System/
    - title: Design and planning
      url: /posts/File-Processing-Design/
    - title: Building the backend
      url: /posts/Building-Our-Code/
    - title: Multipart uploads and metadata
      url: /posts/Enforcing-file-metadaata/

- name: RAG-POC
  group: Backend Systems
  status: POC
  year: 2026
  tagline: An internal chatbot that actually knows the docs.
  summary: >-
    A retrieval pipeline that ingests Confluence pages, Slack history, and code into
    pgvector, then answers questions through a local model. Hybrid search, chunking, and
    a Spring Boot API layer in front of it.
