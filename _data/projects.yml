      alt: Hunllef Helper settings in RuneLite with the Soft Asmr audio mode selected
    - src: /assets/img/hunllef-helper/01-plugin-panel.jpg
      alt: Hunllef Helper panel in RuneLite with the Start and Start mage buttons
  repo: https://github.com/Loze-Put/hunllef-helper
  pr: https://github.com/Loze-Put/hunllef-helper/pull/50
  featured: true

- name: DataFlow
  group: Backend Systems
  status: Shipped
  year: 2026
  tagline: Uploads as a workflow, not a file input.
  summary: >-
    Multipart uploads go straight to S3 through presigned URLs, then a job pipeline
    validates metadata, records every object, and hands off async processing.
    Large files never touch the API server.
  stack: [Java 21, Spring Boot, PostgreSQL, AWS S3, MapStruct]
  photos:
    - src: /assets/img/figures/system-design/file-processor/diagram1.png
      alt: DataFlow design diagram
    - src: /assets/img/figures/system-design/file-processor/diagram2.png
      alt: DataFlow upload flow diagram
    - src: /assets/img/figures/system-design/file-processor/ui-upload.png
      alt: Uploading a file from the UI
    - src: /assets/img/figures/system-design/file-processor/multipart-uploaad.png
      alt: Multipart upload in progress
    - src: /assets/img/figures/system-design/file-processor/s3-upload.png
      alt: Uploaded parts landing in S3
  repo: https://github.com/Eddiecwh/DataFlow
  featured: true
  posts:
    - title: Project talkthrough & goal setting
      url: /posts/File-Processing-System/
    - title: Design and planning
      url: /posts/File-Processing-Design/
    - title: Building the backend
      url: /posts/Building-Our-Code/
    - title: Multipart uploads and metadata
      url: /posts/Enforcing-file-metadaata/

- name: RAG-POC
  group: Backend Systems
  status: POC
  year: 2026
  tagline: Building and understanding a Retrieval-Augmented Generation system from scratch.
  summary: >-
    Most legacy code base knowledge isn't officially documented. It lives in random slack messages with that one Senior developer who worked on the codebase and left 3 years ago. I built out this RAG project as an independent study to serve as an AI chatbot that ingests Confluence pages, Slack history, and code into pgvector, then answers questions through a local model using Ollama. I learned about Hybrid/Keyword search, chunking, and built a Spring Boot API layer in front of it.
  stack:
    [Python, sentence-transformers, PostgreSQL, pgvector, Ollama, Spring Boot]
  photos:
    - src: /assets/img/figures/sb-flask-flow.png
      alt: Spring Boot to Python service request flow
    - src: /assets/img/figures/sb-flow.png
      alt: Spring Boot API layer flow
    - src: /assets/img/figures/query-response-1.png
      alt: A query and the chatbot response
    - src: /assets/img/figures/sample-api-call.png
      alt: Sample API call to the chatbot
  repo: https://github.com/Eddiecwh/RAG-POC
  featured: true
  posts:
    - title: Building the RAG system from scratch
      url: /posts/building-a-rag-system-from-scratch/
    - title: Designing the hybrid search approach
      url: /posts/Designing-the-hybrid-search-approach/
    - title: Building the Spring Boot API layer
      url: /posts/building-out-our-springboot-api-layer/

- name: NotifyFlow
  group: Backend Systems
  status: Shipped
  year: 2026
  tagline: Notifications that survive a crash.
  summary: >-
    A Spring Boot service that decouples intake from delivery with RabbitMQ. Requests
    are persisted, scheduled, retried with exponential backoff, and tracked through a
    job lifecycle with a full audit trail.
  stack: [Java, Spring Boot, RabbitMQ, PostgreSQL, Spring Mail]
  photos:
    - src: /assets/img/figures/system-design/notification-system/design-plan.png
      alt: NotifyFlow design plan
    - src: /assets/img/figures/system-design/notification-system/notification-lifecycle.png
      alt: Notification job lifecycle
  repo: https://github.com/Eddiecwh/NotifyFlow
  posts:
    - title: Notification system design
      url: /posts/Notification-System-part1/

