- name: Hunllef Helper
  group: Passion Projects
  status: Open source
  year: 2025
  tagline: Merged into Loze-Puts RuneLite plugin with 140k+ installs.
  summary: >-
    I added an ASMR voice option to Hunllef Helper, (original plugin made by Loze-Put). The plugin that calls out attack
    styles in Old School RuneScape's Corrupted Gauntlet. My work features RuneLite
    AudioPlayer integration, a new voice pack, and removing the old audio cache.
  stack: [Java, RuneLite API, Open source]
  photos:
