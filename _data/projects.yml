# Projects shown on the home page and /projects/.
# `featured: true` puts the project in the home grid.
# `group` controls which section it appears under on the Projects page.
# `hero: true` makes it the scroll scene on the home page; `screens` are the phone shots.
# `photos` fill the image carousel on its Projects card (falls back to `screens`).
# A photo with `type: video` (plus an optional `poster`) becomes a video slide with play controls.

- name: HF Scoring
  group: Passion Projects
  status: Live
  year: 2025
  tagline: Stage scoring for USPSA matches, on your phone.
  summary: >-
    A scoring app for USPSA stages. Configure your stage then tap in your hits
    and get your hit factor instantly. Stage library, results dashboard, analytics, and CSV
    export. All local, no account needed.
  stack: [JavaScript, GitHub Pages, localStorage]
  demo: https://eddiecwh.github.io/uspsa_scoring/
  repo: https://github.com/Eddiecwh/uspsa_scoring
  featured: true
  hero: true
